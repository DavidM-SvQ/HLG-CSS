<!DOCTYPE html>
<html>
<head>
<style>
  table {
    border-collapse: collapse;
    overflow: hidden; /* Required for the pseudo-element trick */
  }
  td, th {
    position: relative;
    padding: 10px;
    border: 1px solid #ccc;
    background: white; /* Important to see if trick works over backgrounds */
  }
  td.sticky-col {
    position: sticky;
    left: 0;
    z-index: 10;
    background: #eee;
  }
  
  /* Row Hover */
  tr:hover {
    background-color: #f1f5f9;
  }
  /* Column Hover */
  td:hover::after, th:hover::after {
    content: "";
    position: absolute;
    top: -10000px;
    bottom: -10000px;
    left: 0;
    right: 0;
    background-color: rgba(0, 0, 0, 0.05); /* Darken */
    pointer-events: none;
    z-index: 100; /* to overlay other sticky columns' backgrounds etc */
  }
</style>
</head>
<body>
  <table>
    <tr><th>A (Sticky)</th><th>B</th><th>C</th></tr>
    <tr><td class="sticky-col">Row 1 A</td><td>Row 1 B</td><td>Row 1 C</td></tr>
    <tr><td class="sticky-col">Row 2 A <button>btn</button></td><td>Row 2 B</td><td>Row 2 C</td></tr>
  </table>
</body>
</html>
